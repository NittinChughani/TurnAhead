<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fb"><meta name="description" content="Activate an administrator-approved TurnAhead staff invitation."><title>Staff invitation · TurnAhead</title><link rel="icon" href="./assets/favicon.png"><link rel="stylesheet" href="./styles.css"><script defer src="./common.js"></script><script type="module" src="./activate.js"></script></head>
<body class="workspace"><header class="site-header"><nav class="nav shell"><a href="./index.html" class="brand"><img class="logo-day" src="./assets/brand-light.webp" alt="TurnAhead"><img class="logo-night" src="./assets/brand-dark.webp" alt=""></a><div class="workspace-label">/ STAFF INVITATION</div><div class="nav-actions"><a href="./desk.html" class="nav-quiet">Staff sign in</a><button data-theme-toggle class="theme-toggle" aria-label="Toggle dark mode"><span class="theme-sun">☀</span><span class="theme-moon">☾</span></button></div></nav></header>
<main class="shell desk-main"><section class="onboard-wrap"><div class="onboard-card"><span class="kicker">INVITATION-ONLY ACCESS</span><h1>Join your <em>hospital team.</em></h1><p id="activation-state">Checking your invitation…</p>
<form id="activation-form" hidden><label for="activation-email">Invited work email</label><input type="email" id="activation-email" autocomplete="email" required><label for="activation-password">Create your personal password (12+ characters)</label><input type="password" id="activation-password" autocomplete="new-password" minlength="12" required><p class="form-error" id="activation-error" role="alert"></p><button class="btn btn-primary full" type="submit">Activate invited account ↗</button></form>
<form id="existing-form" hidden><label for="existing-email">Existing account email</label><input id="existing-email" type="email" autocomplete="email" required><label for="existing-password">Password</label><input id="existing-password" type="password" autocomplete="current-password" required><p class="form-error" id="existing-error" role="alert"></p><button type="submit" class="btn btn-outline full">Sign in and accept invitation ↗</button></form>
<div id="activation-actions" class="onboard-actions" hidden><button id="activation-verify" type="button" class="btn btn-outline">I've verified my email</button><button id="activation-resend" type="button" class="btn btn-outline">Resend verification</button><button id="activation-accept" type="button" class="btn btn-primary" hidden>Join hospital ↗</button></div>
<div id="activation-options" class="onboard-actions" hidden><button id="activation-existing" type="button" class="inline-link">Already have an account? Sign in</button><button id="activation-new" type="button" class="inline-link">First time? Activate invited account</button><button id="activation-switch" type="button" class="inline-link">Use another email</button></div>
<div id="activation-notice" class="notice" role="status" aria-live="polite" hidden></div>
<p class="form-hint">Invitations are approved by the hospital administrator and bound to the exact verified email address. A link alone never grants access.</p></div></section></main></body></html>
