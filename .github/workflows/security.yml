name: Firestore security emulator
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned emulator tooling
        run: npm install --no-save --package-lock=false --ignore-scripts firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.12.0 firebase-admin@13.4.0
      - name: Run security tests against isolated demo project
        run: npx firebase emulators:exec --config firebase.emulator.json --only firestore --project demo-turnahead "node --test --test-concurrency=1 security/*.test.mjs"
