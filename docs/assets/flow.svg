<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 242" role="img" aria-label="TurnAhead workflow from reception to QR ticket to patient status to live queue">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#132c59"/><stop offset="1" stop-color="#0f477d"/></linearGradient></defs>
<rect width="1180" height="242" rx="24" fill="url(#bg)"/>
<g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
<g transform="translate(40,45)"><rect width="240" height="153" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#7eaccf" stroke-opacity=".4"/><text x="120" y="49" font-size="30" fill="#82e6cf">01</text><text x="120" y="88" font-size="20" fill="#fff">RECEPTION</text><text x="120" y="113" font-size="12" fill="#bbd0e8" font-weight="400">Registers a walk-in</text></g>
<text x="303" y="134" font-size="30" fill="#69dcb9">→</text>
<g transform="translate(326,45)"><rect width="240" height="153" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#7eaccf" stroke-opacity=".4"/><text x="120" y="49" font-size="30" fill="#82e6cf">02</text><text x="120" y="88" font-size="20" fill="#fff">QR TICKET</text><text x="120" y="113" font-size="12" fill="#bbd0e8" font-weight="400">Prints a private link</text></g>
<text x="589" y="134" font-size="30" fill="#69dcb9">→</text>
<g transform="translate(612,45)"><rect width="240" height="153" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#7eaccf" stroke-opacity=".4"/><text x="120" y="49" font-size="30" fill="#82e6cf">03</text><text x="120" y="88" font-size="20" fill="#fff">PATIENT</text><text x="120" y="113" font-size="12" fill="#bbd0e8" font-weight="400">Tracks the queue live</text></g>
<text x="875" y="134" font-size="30" fill="#69dcb9">→</text>
<g transform="translate(898,45)"><rect width="240" height="153" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#7eaccf" stroke-opacity=".4"/><text x="120" y="49" font-size="30" fill="#82e6cf">04</text><text x="120" y="88" font-size="20" fill="#fff">NEXT TURN</text><text x="120" y="113" font-size="12" fill="#bbd0e8" font-weight="400">Everyone stays in sync</text></g>
</g></svg>