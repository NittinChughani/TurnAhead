# One-click preview. SQLite data is EPHEMERAL on the free plan.
# Do not operate a real clinical queue on this configuration.
services:
  - type: web
    name: turnahead
    runtime: node
    plan: free
    buildCommand: echo "No dependencies to install"
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FACILITY_NAME
        value: TurnAhead Demo Clinic
      - key: TIME_ZONE
        value: Asia/Karachi
      - key: DATA_DIR
        value: /opt/render/project/src/data
